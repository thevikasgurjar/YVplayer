<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Picture in Picture</title>
  
  <link rel="preload" href="fonts/tabler-icons.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="tabler-icons.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="tabler-icons.min.css"></noscript>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }
    .pip-stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    :root {
      --pip-aspect: 1.7777777778;
      --pip-inv-aspect: 0.5625;
    }
    .pip-video-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(100vw, calc(100vh * var(--pip-aspect, 1.7777777778)));
      height: min(100vh, calc(100vw * var(--pip-inv-aspect, 0.5625)));
      max-width: 100vw;
      max-height: 100vh;
      aspect-ratio: var(--pip-aspect, 16 / 9);
      overflow: hidden;
      background: #000000 !important;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    #pip-player, .pip-video-container iframe {
      width: 2400% !important;
      height: 100% !important;
      margin-left: -1149.95% !important;
      border: none !important;
      outline: none !important;
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      display: block !important;
      transform: none !important;
      pointer-events: none !important;
    }

    body.is-shorts .pip-video-container {
      aspect-ratio: 9 / 16 !important;
      width: min(100vw, calc(100vh * (9 / 16))) !important;
      height: min(100vh, calc(100vw * (16 / 9))) !important;
    }

    body.is-shorts #pip-player,
    body.is-shorts .pip-video-container iframe {
      position: absolute !important;
      top: 50% !important;
      left: 50% !important;
      transform: translate(-50%, -50%) !important;
      width: 100% !important;
      height: calc(100% * 1.3515) !important;
      margin: 0 !important;
      margin-left: 0 !important;
      border: none !important;
      pointer-events: none !important;
    }
    
    .pip-poster {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      z-index: 4;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .pip-poster.is-hidden {
      opacity: 0;
      pointer-events: none;
    }
    
    .pip-pointer-catcher {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 6;
      cursor: pointer;
      background: transparent;
    }
    .pip-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: rgba(0, 0, 0, 0.42);
      opacity: 0;
      transition: opacity 0.2s ease;
      pointer-events: none;
      cursor: default;
      z-index: 10;
    }
    .pip-overlay.is-visible {
      opacity: 1;
    }
    .pip-center-controls {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      opacity: 0;
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 22px;
      z-index: 20;
      transition: transform 0.2s cubic-bezier(0.2, 0, 0.2, 1), opacity 0.2s ease;
    }
    body.is-paused .pip-center-controls {
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
      pointer-events: auto;
    }
    .pip-center-btn {
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      pointer-events: auto;
      transition: transform 0.12s ease, background 0.15s ease;
    }
    .pip-center-btn:hover {
      transform: scale(1.14);
    }
    .pip-center-btn:active {
      transform: scale(0.95);
    }
    .pip-btn-seek {
      font-size: 19px;
      width: 38px;
      height: 38px;
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    .pip-btn-play {
      font-size: 26px;
      width: 58px;
      height: 58px;
      background: #000000 !important;
      border: 2.5px solid #ffffff;
      color: #fff;
      box-shadow: none !important;
    }
    .pip-bottom-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 8px 14px;
      background: linear-gradient(to top, rgba(0,0,0,0.88) 0%, rgba(0,0,0,0.5) 70%, transparent 100%);
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 20;
      pointer-events: auto;
    }
    .pip-time {
      color: #fff;
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
      letter-spacing: 0.2px;
    }
    .pip-seek-track {
      flex: 1;
      height: 5px;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.28);
      position: relative;
      cursor: pointer;
      pointer-events: auto;
      transition: height 0.15s ease;
    }
    .pip-seek-track:hover {
      height: 7px;
    }
    .pip-seek-fill {
      height: 100%;
      border-radius: inherit;
      background: var(--pipAccent, #fe0001);
      width: 0%;
      position: relative;
      pointer-events: none;
    }
    .pip-action-btn {
      color: #fff;
      font-size: 20px;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      pointer-events: auto;
      transition: color 0.15s ease, transform 0.1s ease;
    }
    .pip-action-btn:hover {
      color: var(--pipAccent, #fe0001);
      transform: scale(1.12);
    }
    .pip-action-btn.is-active {
      color: var(--pipAccent, #fe0001) !important;
    }

    
    .pip-corner-resizer {
      position: absolute;
      width: 32px;
      height: 32px;
      z-index: 35;
      pointer-events: auto;
      user-select: none;
    }
    .pip-corner-resizer::after {
      content: "";
      position: absolute;
      width: 12px;
      height: 12px;
      border-style: solid;
      border-color: rgba(255, 255, 255, 0.7);
      transition: border-color 0.15s ease, transform 0.15s ease;
      pointer-events: none;
    }
    .pip-corner-resizer:hover::after {
      border-color: var(--pipAccent, #fe0001);
      transform: scale(1.25);
    }
    .pip-corner-resizer[data-type="tl"] {
      top: 0;
      left: 0;
      cursor: nwse-resize;
    }
    .pip-corner-resizer[data-type="tl"]::after {
      top: 6px;
      left: 6px;
      border-width: 3px 0 0 3px;
      border-top-left-radius: 4px;
    }
    .pip-corner-resizer[data-type="tr"] {
      top: 0;
      right: 0;
      cursor: nesw-resize;
    }
    .pip-corner-resizer[data-type="tr"]::after {
      top: 6px;
      right: 6px;
      border-width: 3px 3px 0 0;
      border-top-right-radius: 4px;
    }
    .pip-corner-resizer[data-type="bl"] {
      bottom: 0;
      left: 0;
      cursor: nesw-resize;
    }
    .pip-corner-resizer[data-type="bl"]::after {
      bottom: 6px;
      left: 6px;
      border-width: 0 0 3px 3px;
      border-bottom-left-radius: 4px;
    }
    .pip-corner-resizer[data-type="br"] {
      bottom: 0;
      right: 0;
      cursor: nwse-resize;
    }
    .pip-corner-resizer[data-type="br"]::after {
      bottom: 6px;
      right: 6px;
      border-width: 0 3px 3px 0;
      border-bottom-right-radius: 4px;
    }

    
    @media (max-width: 440px), (max-height: 250px) {
      .pip-center-controls {
        gap: 14px;
      }
      .pip-btn-play {
        width: 48px;
        height: 48px;
        font-size: 24px;
      }
      .pip-btn-seek {
        width: 36px;
        height: 36px;
        font-size: 18px;
      }
      .pip-time {
        font-size: 10px;
      }
      .pip-bottom-bar {
        padding: 4px 10px;
        gap: 8px;
      }
    }
    @media (max-width: 320px), (max-height: 180px) {
      .pip-center-controls {
        gap: 10px;
      }
      .pip-btn-play {
        width: 38px;
        height: 38px;
        font-size: 19px;
      }
      .pip-btn-seek {
        width: 28px;
        height: 28px;
        font-size: 14px;
      }
      .pip-time {
        font-size: 9px;
      }
      .pip-bottom-bar {
        padding: 3px 6px;
        gap: 6px;
      }
      .pip-action-btn {
        font-size: 16px;
        padding: 2px;
      }
    }

    
    .pip-captions-box {
      position: absolute;
      left: 0;
      width: 100%;
      bottom: 46px;
      text-align: center;
      pointer-events: none;
      z-index: 15;
      padding: 0 16px;
      box-sizing: border-box;
      display: none;
      transition: bottom 0.2s ease;
    }
    .pip-overlay:not(.is-visible) ~ .pip-captions-box {
      bottom: 12px;
    }
    .pip-caption-line {
      display: inline-block;
      color: #ffffff !important;
      background: transparent !important;
      background-color: transparent !important;
      font-family: 'Inter', Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: clamp(12px, 2.4vw, 15px);
      font-weight: 500;
      letter-spacing: 0.2px;
      line-height: 1.3;
      text-align: center;
      max-width: 92%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-shadow: 
        0 0 2px #000000,
        0 0 4px rgba(0, 0, 0, 0.9),
        0 1px 2px rgba(0, 0, 0, 0.9);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }
  </style>
  <!-- YouTube IFrame API loaded async (non-blocking) -->
  <script src="https://www.youtube.com/iframe_api" async></script>
</head>
<body>
  <div class="pip-stage">
    
    <div class="pip-video-container">
      <div id="pip-player"></div>
      
      <div class="pip-poster" id="pip-poster"></div>
      
      <div class="pip-pointer-catcher" id="pip-catcher"></div>
      
      <div class="pip-overlay is-visible" id="pip-overlay">
        <div class="pip-center-controls">
          <div class="pip-center-btn pip-btn-seek" id="pip-btn-back" title="Rewind 10s"><i class="ti ti-rewind-backward-10"></i></div>
          <div class="pip-center-btn pip-btn-play" id="pip-btn-play" title="Play/Pause"><i class="ti ti-player-pause-filled"></i></div>
          <div class="pip-center-btn pip-btn-seek" id="pip-btn-fwd" title="Forward 10s"><i class="ti ti-rewind-forward-10"></i></div>
        </div>
        <div class="pip-bottom-bar">
          <span class="pip-time" id="pip-time-display">00:00 / 00:00</span>
          <div class="pip-seek-track" id="pip-seek-track">
            <div class="pip-seek-fill" id="pip-seek-fill"></div>
          </div>
          <div class="pip-action-btn" id="pip-btn-cc" title="Toggle Captions (CC)"><i class="ti ti-badge-cc"></i></div>
          
          <div class="pip-action-btn" id="pip-btn-loop" title="Toggle Loop (r)"><i class="ti ti-repeat"></i></div>
          <div class="pip-action-btn" id="pip-btn-restore" title="Back to tab"><i class="ti ti-picture-in-picture-off"></i></div>
        </div>
      </div>
      <div class="pip-captions-box" id="pip-captions-box"><span class="pip-caption-line" id="pip-caption-line"></span></div>
    </div>
    
    <div class="pip-corner-resizer" data-type="tl" title="Drag corner to resize"></div>
    <div class="pip-corner-resizer" data-type="tr" title="Drag corner to resize"></div>
    <div class="pip-corner-resizer" data-type="bl" title="Drag corner to resize"></div>
    <div class="pip-corner-resizer" data-type="br" title="Drag corner to resize"></div>
  </div>

  <script>
    var params = new URLSearchParams(window.location.search);
    var videoId = params.get("id") || "UCdxT4d8k5c";
    var startSec = parseFloat(params.get("start")) || 0;
    var initialAutoplay = true; // Always autoplay in PiP!
    var initialMute = params.get("mute") === "1";
    var initialVol = parseInt(params.get("vol") || "100", 10);
    var initialRate = parseFloat(params.get("rate") || "1");
    var initialTheme = params.get("theme") || "#fe0001";
    if (initialTheme) {
      document.documentElement.style.setProperty("--pipAccent", initialTheme);
    }
    var isShorts = params.get("shorts") === "1" || params.get("shorts") === "true";
    var isLoop = params.has("loop")
      ? (params.get("loop") === "1" || params.get("loop") === "true")
      : isShorts;

    window.addEventListener("message", function(e) {
      if (!e || !e.data) return;
      var d = e.data;
      if (typeof d === "string") {
        try { d = JSON.parse(d); } catch(err) {}
      }
      if (d && d.type === "setLoop") {
        isLoop = !!d.loop;
        if (typeof updateLoopBtnUI === "function") updateLoopBtnUI();
      }
    });

    var player = null;
    var playerReady = false;
    var isPlaying = false;
    var isCaptionsOn = false;
    var currentTime = startSec;
    var duration = 0;

    var playBtn = document.getElementById("pip-btn-play");
    var backBtn = document.getElementById("pip-btn-back");
    var fwdBtn = document.getElementById("pip-btn-fwd");
    var timeDisplay = document.getElementById("pip-time-display");
    var seekTrack = document.getElementById("pip-seek-track");
    var seekFill = document.getElementById("pip-seek-fill");
    var ccBtn = document.getElementById("pip-btn-cc");
    var sizeBtn = document.getElementById("pip-btn-size");
    var restoreBtn = document.getElementById("pip-btn-restore");
    var overlay = document.getElementById("pip-overlay");
    var catcher = document.getElementById("pip-catcher");
    var poster = document.getElementById("pip-poster");
    var cornerResizer = document.getElementById("pip-corner-resizer");
    var captionBox = document.getElementById("pip-captions-box");
    var captionLine = document.getElementById("pip-caption-line");
    var captionsList = [];

    function loadCaptions(vid) {
      captionsList = [];
      if (!vid) return;
      fetch("/api/captions?id=" + encodeURIComponent(vid))
        .then(r => r.json())
        .then(data => {
          if (data && data.success && Array.isArray(data.captions)) {
            captionsList = data.captions;
          }
        })
        .catch(e => {});
    }
    loadCaptions(videoId);

    function updateCaptions() {
      if (!captionBox || !captionLine) return;
      if (!isCaptionsOn || !captionsList || captionsList.length === 0) {
        if (captionLine.textContent !== "") captionLine.textContent = "";
        captionBox.style.display = "none";
        return;
      }
      var match = null;
      for (var i = 0; i < captionsList.length; i++) {
        var c = captionsList[i];
        if (currentTime >= c.start && currentTime < c.end) {
          match = c;
          break;
        }
      }
      if (match) {
        if (captionLine.textContent !== match.text) {
          captionLine.textContent = match.text;
        }
        captionBox.style.display = "block";
      } else {
        if (captionLine.textContent !== "") {
          captionLine.textContent = "";
        }
        captionBox.style.display = "none";
      }
    }

    var ASPECT = parseFloat(params.get("aspect")) || (16 / 9);
    var isShortsParam = params.get("shorts") === "1" || ASPECT < 1;
    if (isShortsParam) {
      document.body.classList.add("is-shorts");
    }
    if (params.get("live") === "1") {
      document.body.classList.add("is-live");
    }
    try {
      document.documentElement.style.setProperty("--pip-aspect", ASPECT);
      document.documentElement.style.setProperty("--pip-inv-aspect", (1 / ASPECT).toFixed(6));
    } catch(e) {}

    var isResizingWindow = false;
    var resizeTimer = null;
    var lastKnownW = window.innerWidth;
    var lastKnownH = window.innerHeight;

    function getPipTargetWin() {
      try {
        if (window.parent && window.parent !== window && typeof window.parent.resizeTo === "function") {
          return window.parent;
        }
      } catch (e) {}
      return window;
    }

    function syncPipResize(targetClientW, targetClientH) {
      var targetWin = getPipTargetWin();
      var chromeW = 0;
      var chromeH = 0;
      try {
        chromeW = Math.max(0, targetWin.outerWidth - targetWin.innerWidth);
        chromeH = Math.max(0, targetWin.outerHeight - targetWin.innerHeight);
      } catch (e) {}

      var outerW = Math.round(targetClientW + chromeW);
      var outerH = Math.round(targetClientH + chromeH);

      try {
        targetWin.resizeTo(outerW, outerH);
      } catch (e) {}
      try {
        targetWin.postMessage({ type: "pipResize", width: targetClientW, height: targetClientH }, "*");
      } catch (e) {}
    }

    // Synchronize OS-level window dimensions strictly in ratio
    function lockConnectedAspectRatio() {
      if (isResizingWindow) return;
      var targetWin = getPipTargetWin();
      var curW = targetWin.innerWidth || window.innerWidth;
      var curH = targetWin.innerHeight || window.innerHeight;

      if (!curW || !curH || curW <= 0 || curH <= 0) return;

      var dw = Math.abs(curW - lastKnownW);
      var dh = Math.abs(curH - lastKnownH);

      if (dw < 2 && dh < 2) return;

      var targetW = curW;
      var targetH = curH;

      // If stretched horizontally (from left or right), scale the other side (height) accordingly
      if (dw >= dh * ASPECT) {
        targetW = Math.max(320, curW);
        targetH = Math.round(targetW / ASPECT);
      } else {
        // If stretched vertically, scale the other side (width) accordingly
        targetH = Math.max(180, curH);
        targetW = Math.round(targetH * ASPECT);
      }

      if (Math.abs(curW - targetW) > 1 || Math.abs(curH - targetH) > 1) {
        isResizingWindow = true;
        lastKnownW = targetW;
        lastKnownH = targetH;
        syncPipResize(targetW, targetH);
        setTimeout(function() { isResizingWindow = false; }, 30);
      } else {
        lastKnownW = curW;
        lastKnownH = curH;
      }
    }

    // Flexible window resize: container automatically letterboxes/pillarboxes without cropping
    window.addEventListener("resize", function() {
      updateUI();
    });

    // 4 Corner Resizers for OS-level Document PiP (Strict Ratio Lock)
    document.querySelectorAll(".pip-corner-resizer").forEach(function(handle) {
      var type = handle.getAttribute("data-type") || "br";
      handle.addEventListener("mousedown", function(e) {
        e.preventDefault();
        e.stopPropagation();

        var targetWin = getPipTargetWin();
        var startScreenX = e.screenX;
        var startScreenY = e.screenY;
        var startW = targetWin.innerWidth || window.innerWidth;
        var startH = targetWin.innerHeight || window.innerHeight;
        var cursor = window.getComputedStyle(handle).cursor;

        var shield = document.createElement("div");
        shield.style.cssText = "position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:99999999;cursor:" + cursor + ";user-select:none;";
        document.body.appendChild(shield);

        function onMouseMove(moveEvt) {
          var dx = moveEvt.screenX - startScreenX;
          var dy = moveEvt.screenY - startScreenY;
          var deltaW = 0;

          if (type === "br") {
            // Drag bottom-right: dragging right or down increases size
            if (Math.abs(dx) >= Math.abs(dy * ASPECT)) {
              deltaW = dx;
            } else {
              deltaW = dy * ASPECT;
            }
          } else if (type === "tl") {
            // Drag top-left: dragging left or up increases size
            if (Math.abs(dx) >= Math.abs(dy * ASPECT)) {
              deltaW = -dx;
            } else {
              deltaW = -dy * ASPECT;
            }
          } else if (type === "tr") {
            // Drag top-right: dragging right or up increases size
            if (Math.abs(dx) >= Math.abs(dy * ASPECT)) {
              deltaW = dx;
            } else {
              deltaW = -dy * ASPECT;
            }
          } else if (type === "bl") {
            // Drag bottom-left: dragging left or down increases size
            if (Math.abs(dx) >= Math.abs(dy * ASPECT)) {
              deltaW = -dx;
            } else {
              deltaW = dy * ASPECT;
            }
          }

          var newW = Math.max(320, Math.round(startW + deltaW));
          if (window.screen && window.screen.availWidth) {
            newW = Math.min(newW, Math.floor(window.screen.availWidth * 0.96));
          }
          var newH = Math.round(newW / ASPECT);

          isResizingWindow = true;
          lastKnownW = newW;
          lastKnownH = newH;
          syncPipResize(newW, newH);
          setTimeout(function() { isResizingWindow = false; }, 20);
        }

        function onMouseUp() {
          shield.remove();
          document.removeEventListener("mousemove", onMouseMove);
          document.removeEventListener("mouseup", onMouseUp);
        }

        document.addEventListener("mousemove", onMouseMove);
        document.addEventListener("mouseup", onMouseUp);
      });
    });

    if (poster && videoId) {
      poster.style.backgroundImage = `url("https://img.youtube.com/vi/${encodeURIComponent(videoId)}/hqdefault.jpg")`;
      var hiRes = new Image();
      hiRes.onload = () => {
        if (hiRes.naturalWidth > 120) {
          poster.style.backgroundImage = `url("https://img.youtube.com/vi/${encodeURIComponent(videoId)}/maxresdefault.jpg")`;
        }
      };
      hiRes.src = `https://img.youtube.com/vi/${encodeURIComponent(videoId)}/maxresdefault.jpg`;
    }

    function formatTime(seconds) {
      if (!seconds || isNaN(seconds) || seconds < 0) seconds = 0;
      var h = Math.floor(seconds / 3600);
      var m = Math.floor((seconds % 3600) / 60);
      var s = Math.floor(seconds % 60);
      return h > 0 
        ? `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`
        : `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function updateUI() {
      if (timeDisplay) {
        timeDisplay.textContent = formatTime(currentTime) + " / " + formatTime(duration);
      }
      if (seekFill && duration > 0) {
        var pct = Math.max(0, Math.min(100, (currentTime / duration) * 100));
        seekFill.style.width = pct + "%";
      }
      updateCaptions();
    }

    function setPlayState(playing) {
      isPlaying = playing;
      document.body.classList.toggle("is-playing", playing);
      document.body.classList.toggle("is-paused", !playing);
      if (playBtn) {
        playBtn.innerHTML = playing 
          ? '<i class="ti ti-player-pause-filled"></i>' 
          : '<i class="ti ti-player-play-filled"></i>';
      }
      if (!playing) {
        if (overlay) overlay.classList.add("is-visible");
        clearTimeout(overlayTimeout);
      } else {
        showControls();
      }
      syncState();
    }

    function syncState() {
      try {
        if (window.parent && window.parent.pipState) {
          window.parent.pipState.currentTime = currentTime;
          window.parent.pipState.isPlaying = isPlaying;
        }
        var msg = { type: "pipState", currentTime: currentTime, isPlaying: isPlaying, loop: isLoop };
        if (window.parent) window.parent.postMessage(msg, "*");
        if (window.opener) window.opener.postMessage(msg, "*");
      } catch (e) {}
    }

    window.getCurrentTime = () => currentTime;
    window.getDuration = () => duration;
    window.getIsPlaying = () => isPlaying;

    function togglePlay() {
      if (!player || !playerReady) return;
      var state = -1;
      try { state = player.getPlayerState(); } catch(e) {}

      if (state === 1) { // Currently playing -> pause
        player.pauseVideo();
        setPlayState(false);
      } else { // Paused, Cued, Unstarted -> play
        try {
          player.unMute();
          if (!isNaN(initialVol)) player.setVolume(initialVol);
        } catch (e) {}
        player.playVideo();
        setPlayState(true);
      }
    }

    function toggleCaptions() {
      isCaptionsOn = !isCaptionsOn;
      if (ccBtn) {
        ccBtn.classList.toggle("is-active", isCaptionsOn);
      }
      updateCaptions();
    }

    function closePiP() {
      try {
        syncState();
        if (window.parent && window.parent !== window && window.parent.close) {
          window.parent.close();
        } else {
          window.close();
        }
      } catch (e) {}
    }

    var overlayTimeout = null;
    function showControls() {
      if (overlay) overlay.classList.add("is-visible");
      clearTimeout(overlayTimeout);
      if (isPlaying) {
        overlayTimeout = setTimeout(() => {
          if (isPlaying && overlay) {
            overlay.classList.remove("is-visible");
          }
        }, 2800);
      }
    }

    window.addEventListener("mousemove", showControls);
    window.addEventListener("mousedown", showControls);
    if (catcher) {
      catcher.addEventListener("mousemove", showControls);
      catcher.addEventListener("click", togglePlay);
    }
    var stage = document.querySelector(".pip-stage");
    if (stage) {
      stage.addEventListener("click", function(e) {
        if (e.target === stage) {
          togglePlay();
        }
      });
    }

    playBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      togglePlay();
    });

    backBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      if (!player || !playerReady) return;
      currentTime = Math.max(0, currentTime - 10);
      player.seekTo(currentTime, true);
      updateUI();
      syncState();
      showControls();
    });

    fwdBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      if (!player || !playerReady) return;
      currentTime = Math.min(duration || currentTime + 10, currentTime + 10);
      player.seekTo(currentTime, true);
      updateUI();
      syncState();
      showControls();
    });

    seekTrack.addEventListener("click", (e) => {
      e.stopPropagation();
      if (!player || !playerReady || duration <= 0) return;
      var rect = seekTrack.getBoundingClientRect();
      var pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      var targetTime = pct * duration;
      currentTime = targetTime;
      player.seekTo(currentTime, true);
      updateUI();
      syncState();
      showControls();
    });

    if (ccBtn) {
      ccBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        toggleCaptions();
      });
    }

    var loopBtn = document.getElementById("pip-btn-loop");
    function updateLoopBtnUI() {
      if (loopBtn) {
        loopBtn.classList.toggle("is-active", !!isLoop);
        loopBtn.title = isLoop ? "Loop On (r)" : "Loop Off (r)";
      }
    }
    updateLoopBtnUI();

    if (loopBtn) {
      loopBtn.addEventListener("click", function(e) {
        e.stopPropagation();
        isLoop = !isLoop;
        updateLoopBtnUI();
        syncState();
      });
    }

    restoreBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      closePiP();
    });

    window.addEventListener("keydown", (e) => {
      if (e.key === " " || e.key === "k" || e.key === "K") {
        e.preventDefault();
        togglePlay();
      } else if (e.key === "ArrowLeft" || e.key === "j" || e.key === "J") {
        e.preventDefault();
        if (player && playerReady) {
          currentTime = Math.max(0, currentTime - 10);
          player.seekTo(currentTime, true);
          updateUI();
          syncState();
          showControls();
        }
      } else if (e.key === "ArrowRight" || e.key === "l" || e.key === "L") {
        e.preventDefault();
        if (player && playerReady) {
          currentTime = Math.min(duration || currentTime + 10, currentTime + 10);
          player.seekTo(currentTime, true);
          updateUI();
          syncState();
          showControls();
        }
      } else if (e.key === "c" || e.key === "C") {
        e.preventDefault();
        toggleCaptions();
      } else if (e.key === "Escape") {
        e.preventDefault();
        closePiP();
      }
    });

    window.onYouTubeIframeAPIReady = function() {
      if (player) return;
      var isNoCookie = urlParams.get("nocookie") !== "false";
      var ytHost = isNoCookie ? "https://www.youtube-nocookie.com" : "https://www.youtube.com";
      player = new YT.Player('pip-player', {
        host: ytHost,
        videoId: videoId,
        width: isShorts ? '666' : '100%',
        height: isShorts ? '1600' : '100%',
        playerVars: {
          controls: 0,
          autoplay: 1,
          mute: 1,
          start: Math.floor(startSec),
          playsinline: 1,
          rel: 0,
          disablekb: 1,
          iv_load_policy: 3,
          modestbranding: 1,
          enablejsapi: 1,
          origin: window.location.origin
        },
        events: {
          onReady: onPlayerReady,
          onStateChange: onPlayerStateChange
        }
      });
    };

    if (window.YT && window.YT.Player) {
      window.onYouTubeIframeAPIReady();
    }

    function onPlayerReady(event) {
      playerReady = true;

      if (startSec > 0) {
        player.seekTo(startSec, true);
      }

      duration = player.getDuration() || 0;
      currentTime = player.getCurrentTime() || startSec;
      updateUI();
      syncState();

      try {
        player.playVideo();
        if (!initialMute) {
          player.unMute();
          if (!isNaN(initialVol)) player.setVolume(initialVol);
        }
      } catch (e) {}

      var watchdogAttempts = 0;
      var watchdogTimer = setInterval(() => {
        if (!player) return;
        var st = -1;
        try { st = player.getPlayerState(); } catch(e) {}
        if (st === 1) { // Successfully playing
          clearInterval(watchdogTimer);
          setPlayState(true);
          if (poster) {
            poster.classList.add("is-hidden");
            setTimeout(() => { poster.style.display = "none"; }, 350);
          }
        } else {
          watchdogAttempts++;
          if (watchdogAttempts <= 12) {
            try {
              player.mute();
              player.playVideo();
              setTimeout(() => {
                if (!initialMute) {
                  try {
                    player.unMute();
                    if (!isNaN(initialVol)) player.setVolume(initialVol);
                  } catch(e) {}
                }
              }, 300);
            } catch(e) {}
          } else {
            clearInterval(watchdogTimer);
          }
        }
      }, 250);

      setInterval(() => {
        if (player && playerReady) {
          try {
            var t = player.getCurrentTime();
            var d = player.getDuration();
            if (typeof t === "number" && !isNaN(t)) currentTime = t;
            if (typeof d === "number" && d > 0) duration = d;

            if (duration > 0 && currentTime >= duration - 0.2 && isPlaying) {
              try {
                player.seekTo(0, true);
                player.pauseVideo();
              } catch(e) {}
              currentTime = duration;
              setPlayState(false);
              if (poster) {
                poster.style.display = "block";
                poster.classList.remove("is-hidden");
              }
              updateUI();
              syncState();
              return;
            }
            updateUI();
            syncState();
          } catch(e) {}
        }
      }, 350);
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        setPlayState(true);
        if (poster) {
          poster.classList.add("is-hidden");
          setTimeout(() => { poster.style.display = "none"; }, 350);
        }
        if (!initialMute) {
          try {
            player.unMute();
            if (!isNaN(initialVol)) player.setVolume(initialVol);
          } catch (e) {}
        }
      } else if (event.data === YT.PlayerState.PAUSED) {
        setPlayState(false);
      } else if (event.data === YT.PlayerState.ENDED) {
        if (isLoop) {
          try {
            player.seekTo(0, true);
            player.playVideo();
          } catch(e) {}
        } else {
          setPlayState(false);
          try {
            player.seekTo(0, true);
            player.pauseVideo();
          } catch(e) {}
          if (poster) {
            poster.style.display = "block";
            poster.classList.remove("is-hidden");
          }
        }
      } else if (event.data === YT.PlayerState.CUED) {
        setPlayState(false);
      }
      syncState();
    }
  </script>
</body>
</html>
